# The whole path a printed code takes, in containers.
#
# A scan hits the resolver, the resolver redirects to a published bundle, and the bundle is
# served by a static host that knows nothing about any of this. That separation is the
# point rather than an arrangement of convenience: every bundle already published keeps
# working when the resolver is stopped, and the only thing the resolver contributes is the
# redirect.
name: taggant

services:
  resolver:
    build:
      context: ..
      dockerfile: services/resolver/Dockerfile
    command: ["/srv/links/links.json", "--port", "8080", "--origin", "http://localhost:8080"]
    ports:
      - "8080:8080"
    volumes:
      # Mounted, not baked in: the table is the one thing that changes without the code
      # changing, and baking it would mean rebuilding an image to add a product.
      - ./links:/srv/links:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  bundles:
    # A plain static host. Nothing here knows what a Digital Link is, which is what makes
    # the continuity claim true: this container is replaceable by any file server.
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./bundles:/usr/share/nginx/html:ro
    healthcheck:
      # Answering is the health question; having content is not. nginx returns 403 for a
      # directory with no index, and this image's wget exits non-zero for any error
      # response, so an empty bundles folder was reported as an unhealthy container while
      # nginx was working perfectly well. What is checked is that a status line came back
      # at all, whatever it says.
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://127.0.0.1/ 2>&1 | grep -q 'HTTP/1'"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  console:
    # Not started by default, which is why it carries a profile. Everything above answers
    # requests about things that already exist; this one creates them, and it does so with
    # no authentication of any kind. Start it deliberately:
    #
    #     docker compose -f infra/compose.yaml --profile authoring up --build
    #
    # The port is published on the loopback address only. That is not belt and braces, it
    # is the whole of the protection: anyone who can reach this can write files, run the
    # compiler, and replace the link table that every printed code depends on.
    profiles: ["authoring"]
    build:
      context: ..
      dockerfile: apps/console/Dockerfile
    # The console writes into three directories that belong to whoever checked this out,
    # so it has to run as somebody who can. The image's own user cannot: a bind mount on
    # Linux carries the host's ownership, and writing the link table failed with EACCES
    # while every other container was healthy. Windows and macOS hide this, because their
    # bind mounts do not enforce ownership at all, so it appears first on a Linux host or
    # in continuous integration.
    #
    # Set these to your own: TAGGANT_UID=$(id -u) TAGGANT_GID=$(id -g) docker compose ...
    user: "${TAGGANT_UID:-1000}:${TAGGANT_GID:-1000}"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      # The three things it writes, all of them outside the image. The link table is the
      # same file the resolver reads, and the bundles folder is the one the static host
      # serves, so publishing here is immediately visible to both.
      - ./workspace:/srv/workspace
      - ./bundles:/srv/bundles
      - ./links:/srv/links
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
