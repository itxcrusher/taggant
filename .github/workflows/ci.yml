name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm check
      # The runtime is browser code and its test drives a real Chromium against a
      # synthetic camera, so the browser has to be here before the tests run. It also
      # needs the runtime bundle, which is why that one package is built first.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @taggant/runtime build
      - run: pnpm -r test
      - run: pnpm -r build
