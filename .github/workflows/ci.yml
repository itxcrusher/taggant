name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm check
      # Two packages drive a real Chromium against a synthetic camera, so the browser has
      # to be here before the tests run. Those tests also work on build output rather than
      # source: the runtime is loaded into a page as a built module, and the bundler's job
      # is to package built modules, so everything is built before anything is tested.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm -r build
      - run: pnpm -r test
