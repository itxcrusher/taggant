name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm check
      # Two packages drive a real browser against a synthetic camera, and the descriptor
      # comparison drives all three engines, so the browsers have to be here before the
      # tests run. Those tests also work on build output rather than source: the runtime is
      # loaded into a page as a built module, and the bundler's job is to package built
      # modules, so everything is built before anything is tested.
      #
      # The browser downloads are the largest thing this job fetches and they only change
      # when the lockfile does. `playwright install` still runs on a hit, because the system
      # libraries `--with-deps` installs are not in this cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm -r build
      # A browser that installs and then cannot launch is skipped with a warning rather
      # than failing, which is right on a contributor's machine and wrong here: this job is
      # where the claim that all three engines agree is supposed to be earned. Naming them
      # makes a run that quietly covered one engine fail and say which are missing.
      - name: test
        run: |
          set -o pipefail
          pnpm -r test 2>&1 | tee test-output.txt
        env:
          TAGGANT_REQUIRE_ENGINES: chromium,firefox,webkit
      # A failed run here is otherwise only readable as an exit code, because fetching job
      # logs needs a token and a browser test that fails on a runner and passes on a laptop
      # is exactly the one worth reading. These lines become annotations on the run.
      - name: say what failed
        if: failure()
        run: |
          echo "::error::the test step failed; the lines below are from its output"
          grep -aE "FAIL|AssertionError|Error:|never reached|could not be launched" test-output.txt | head -40 | sed 's/^/::error::/'

  # The path a printed code takes, in containers, on every push. What this covers is the
  # part no unit test can: that the image builds, the stack comes up healthy, a scan
  # reaches a bundle on a host that knows nothing about Digital Links, and stopping the
  # resolver does not take the published bundle with it.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Publish a real bundle into the stack, the way the infra README says to.
      - run: |
          node packages/compiler/dist/cli.js examples/postcard/artwork.png             --id front --scan-distance 350 --out front.target.json
          node packages/bundler/dist/cli.js examples/postcard/manifest.json             --target front=front.target.json --out infra/bundles/postcard

      # `--wait` rather than `up -d` on its own: the latter returns once containers are
      # created, not once they answer, and the smoke tests then raced the servers.
      - run: docker compose -f infra/compose.yaml up -d --build --wait
      - run: node infra/smoke.mjs

      # The authoring loop, from nothing. This one is here because the step it ends on was
      # broken and everything else was green: the resolver noticed a changed link table
      # with a file watch, which dies when the file is replaced by a rename and which a
      # bind mount often never feeds at all.
      # The console writes directories this checkout owns, so it runs as this user rather
      # than as the image's. See the comment in compose.yaml.
      - run: |
          TAGGANT_UID=$(id -u) TAGGANT_GID=$(id -g)             docker compose -f infra/compose.yaml --profile authoring up -d --build --wait console
      - run: node infra/authoring-smoke.mjs

      # The continuity claim, checked rather than stated: a bundle outlives the service
      # that routed people to it.
      - name: stop the resolver and check the bundle still serves
        run: |
          docker compose -f infra/compose.yaml stop resolver
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/postcard/)
          echo "the published bundle answers $code with the resolver stopped"
          test "$code" = "200"

      - if: always()
        run: docker compose -f infra/compose.yaml logs resolver | tail -50
      - if: always()
        run: docker compose -f infra/compose.yaml --profile authoring logs console | tail -30
      - if: always()
        run: docker compose -f infra/compose.yaml --profile authoring down -v
