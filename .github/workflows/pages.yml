# The project page, published by hand rather than on every push.
#
# Run from the Actions tab. It is not on `push` because a repository with Pages turned off
# would fail this job on every commit, and a red build that means nothing is worse than no
# build at all. Turn Pages on with GitHub Actions as the source, then run this.
name: pages
on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The page that measures a camera needs three things the repository does not check in:
      # the vision core as a module, the example artwork, and that artwork compiled. They are
      # assembled here rather than committed, so what is published is what this commit builds
      # and nobody has to remember to regenerate anything.
      - name: assemble the site
        run: |
          set -o pipefail
          node packages/compiler/dist/cli.js examples/postcard/artwork.png             --id front --scan-distance 350 --out site/measure/front.target.json
          mkdir -p site/measure/runtime
          cp packages/vision/dist/index.js site/measure/runtime/vision.js
          cp examples/postcard/artwork.png site/artwork.png
          test -s site/measure/front.target.json
          test -s site/measure/runtime/vision.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
