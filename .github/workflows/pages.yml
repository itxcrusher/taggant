# The project page, published by hand rather than on every push.
#
# Run from the Actions tab. It is not on `push` because a repository with Pages turned off
# would fail this job on every commit, and a red build that means nothing is worse than no
# build at all. Turn Pages on with GitHub Actions as the source, then run this.
name: pages
on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
