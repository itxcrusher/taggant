<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Postcard</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #101014; color: #eff0fc; font: 14px/1.5 ui-monospace, monospace; }
      #scene { position: relative; width: 100vw; height: 100vh; }
      #status {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
        background: #101014e6; border-top: 1px solid #2a2a34;
      }
      #scene[data-state="tracking"] ~ #status { color: #7fe0a8; }
      #scene[data-state="denied"] ~ #status, #scene[data-state="error"] ~ #status { color: #ff8f7a; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <p id="status">Starting.</p>
    <script type="module">
      const status = document.getElementById("status");
      const scene = document.getElementById("scene");
      let showing = null;

      // Said on the page, not only in a console nobody has open.
      //
      // Everything below is loaded from `dist`, which means the two likeliest ways to
      // arrive here both fail before any of it runs: skipping `pnpm -r build`, and opening
      // this file directly instead of serving it, which a browser refuses for a module. A
      // module that fails while it is being evaluated is a page error rather than a
      // rejection, so neither a try nor an unhandledrejection handler inside it would fire:
      // it has to be caught from outside, which is what this listener is.
      // Set when something more specific has already been said, so a general handler does
      // not replace it with a vaguer version of the same news.
      let explained = false;
      const failed = (why) => {
        if (explained) return;
        explained = true;
        scene.dataset.state = "error";
        const said = String(why).replace(/\.$/, "");
        // Generic on purpose. An earlier version appended advice about serving the folder
        // and running the commands, which is right for a file that is not there and wrong
        // for a target file this build cannot read: it sent a reader to redo steps they had
        // already done correctly.
        // Not appended when the specific message already points somewhere, or a reader gets
        // two sentences about the README in a row.
        status.textContent = said.includes("README")
          ? said + "."
          : said + ". The README's Run it section has the steps.";
      };
      // Both, because which one fires depends on how the failure arrived. An import that
      // cannot be fetched rejects, and this module is evaluated with a top level await, so
      // that is an unhandled rejection; a script that throws while being parsed is an error.
      // Neither is catchable from inside the module that failed.
      window.addEventListener("error", (event) => failed(event.error?.message ?? event.message ?? "unknown"));
      window.addEventListener("unhandledrejection", (event) => failed(event.reason?.message ?? event.reason));

      const { mountExperience } = await import("../../packages/runtime/dist/index.js");
      const { validateManifest } = await import("../../packages/manifest/dist/index.js");
      const { fromTargetFile } = await import("../../packages/vision/dist/index.js");
      const say = {
        idle: "Starting.",
        requesting: "Asking for the camera.",
        denied: "The camera was refused. Allow it for this page and reload.",
        error: "The camera could not be opened.",
        searching: "Point the camera at the printed artwork.",
        tracking: "Found it.",
      };

      // Each file gets the reason it is actually missing. One shared message said the
      // compile step writes it, which is true of the target and not of the manifest: the
      // manifest is checked in and the compile step never touches it, so a reader whose
      // server was pointed at the wrong folder was told to run a step that would not help.
      const read = async (path, why) => {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`${path} is not there (${response.status}). ${why}`);
        return response.json();
      };
      const [manifestJson, targetJson] = await Promise.all([
        read("./manifest.json", "It sits beside this page, so the server is probably serving the wrong folder."),
        read("./front.target.json", "The README's compile step writes it."),
      ]);

      // Both are read through the checks written for them rather than trusted. A manifest
      // is a format other people write, and the runtime will follow its fallback.
      const manifest = validateManifest(manifestJson);
      if (!manifest.ok) {
        // Said here and then marked as said, because throwing afterwards reached the handler
        // above, which replaced this with the word "invalid manifest" and lost the path and
        // the reason: the two things an author needs.
        explained = true;
        scene.dataset.state = "error";
        status.textContent = `This manifest is not valid: ${manifest.errors[0].path} ${manifest.errors[0].message}`;
        throw new Error("invalid manifest");
      }

      window.taggantExperience = await mountExperience({
        manifest: manifest.value,
        targets: [fromTargetFile(targetJson)],
        container: document.getElementById("scene"),
        options: {
          resolve: (src) => `./${src}`,
          onStateChange: (state) => {
            // A problem outlives the state that follows it, or the sentence written for a
            // viewer replaces it in the same task: an author whose manifest names a target
            // nothing was built for was told to point the camera at it instead. Finding the
            // artwork clears it, since that is worth saying.
            if (state === "tracking") showing = null;
            status.textContent = showing ?? (say[state] ?? state);
          },
          onProblem: (message, kind) => {
            // By what sort of problem it is, not by the state at the time: most of the
            // runtime's reports arrive before the state they belong to is set. A camera
            // reason goes to the console because the sentences above are what this page has
            // chosen to tell a person; anything about the manifest is shown, because the
            // person reading it is usually the one who wrote it.
            if (kind === "camera") {
              console.warn(message);
              return;
            }
            showing = message;
            status.textContent = message;
          },
        },
      });
    </script>
  </body>
</html>
