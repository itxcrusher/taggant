<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Postcard</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #101014; color: #eff0fc; font: 14px/1.5 ui-monospace, monospace; }
      #scene { position: relative; width: 100vw; height: 100vh; }
      #status {
        position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
        background: #101014e6; border-top: 1px solid #2a2a34;
      }
      #scene[data-state="tracking"] ~ #status { color: #7fe0a8; }
      #scene[data-state="denied"] ~ #status, #scene[data-state="error"] ~ #status { color: #ff8f7a; }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <p id="status">Starting.</p>
    <script type="module">
      import { mountExperience } from "../../packages/runtime/dist/index.js";
      import { validateManifest } from "../../packages/manifest/dist/index.js";
      import { fromTargetFile } from "../../packages/vision/dist/index.js";

      const status = document.getElementById("status");
      const say = {
        idle: "Starting.",
        requesting: "Asking for the camera.",
        denied: "The camera was refused. Allow it for this page and reload.",
        error: "The camera could not be opened.",
        searching: "Point the camera at the printed artwork.",
        tracking: "Found it.",
      };

      const [manifestJson, targetJson] = await Promise.all([
        fetch("./manifest.json").then((r) => r.json()),
        fetch("./front.target.json").then((r) => r.json()),
      ]);

      // Both are read through the checks written for them rather than trusted. A manifest
      // is a format other people write, and the runtime will follow its fallback.
      const manifest = validateManifest(manifestJson);
      if (!manifest.ok) {
        status.textContent = `This manifest is not valid: ${manifest.errors[0].path} ${manifest.errors[0].message}`;
        throw new Error("invalid manifest");
      }

      window.taggantExperience = await mountExperience({
        manifest: manifest.value,
        targets: [fromTargetFile(targetJson)],
        container: document.getElementById("scene"),
        options: {
          resolve: (src) => `./${src}`,
          onStateChange: (state) => {
            status.textContent = say[state] ?? state;
          },
          onProblem: (message) => {
            // The runtime says why it gave up on a camera, and the sentences above are what
            // this page has chosen to tell a person. So a camera reason goes to the console
            // and everything else, which is about the manifest, is shown.
            const scene = document.getElementById("scene");
            if (scene.dataset.state === "error" || scene.dataset.state === "denied") {
              console.warn(message);
              return;
            }
            status.textContent = message;
          },
        },
      });
    </script>
  </body>
</html>
